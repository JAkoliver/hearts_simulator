<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perilune &mdash; Account</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family:'Space Grotesk';
    src:url('/static/fonts/space-grotesk.woff2') format('woff2');
    font-weight:300 700; font-display:swap; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui, sans-serif; background:#121212; color:#ECECEC;
         padding:18px 16px 40px; max-width:640px; margin:0 auto; }
  h1 { font-family:'Space Grotesk', system-ui, sans-serif; font-size:1.1rem;
       margin-bottom:2px; }
  a { color:#E8B923; }
  .muted { color:#A6A6AF; }
  .small { font-size:.72rem; }
  .panel { background:#1E1E21; border-radius:10px; padding:14px 16px;
           margin-top:12px; }
  .panel h3 { font-size:.72rem; color:#A6A6AF; text-transform:uppercase;
              letter-spacing:.05em; margin-bottom:8px; }
  button { background:#26262A; color:#ECECEC; border:0; border-radius:7px;
           padding:5px 12px; cursor:pointer; font-size:.8rem;
           margin-right:4px; }
  button:hover { background:#33333A; }
  code { background:#26262A; padding:3px 8px; border-radius:5px;
         font-size:.8rem; word-break:break-all; }
</style>
</head>
<body>
<h1>Account</h1>
<div class="muted small" id="sub"></div>

<div class="panel" id="key-sec">
  <h3>Identity key</h3>
  <div id="key-body"><button id="key-btn">your key</button>
    <span class="small muted">&middot; moves your identity to another
    device</span>
    <div style="margin-top:8px"><button id="rot-btn">compromised key?
      generate a replacement</button>
    <span class="small muted">&middot; if someone else may have seen your
    key</span></div></div>
</div>



<script>
const el = id => document.getElementById(id);
const pid = localStorage.getItem('hearts_pid') || '';

if (!pid) {
  el('sub').textContent = 'no identity on this device yet - one is created '
    + 'when you first play (or restore a key from the home menu).';
  el('key-sec').style.display = 'none';
} else {
  fetch(`/api/name?pid=${encodeURIComponent(pid)}`)
    .then(r => r.ok ? r.json() : null)
    .then(d => { el('sub').textContent = d ? `you play as ${d.name}` : ''; })
    .catch(() => {});

  const showKey = k => {
    el('key-body').innerHTML = `<code style="user-select:all">${k}</code>
      <div style="margin-top:6px">
        <button id="key-copy">copy</button>
        <button id="key-dl">download key file</button>
        <button id="key-hide">hide</button></div>
      <div class="small muted" style="margin-top:4px">Keep it private.
      Restore it on another device from the home menu.</div>`;
    el('key-copy').onclick = async () => {
      try { await navigator.clipboard.writeText(k);
            el('key-copy').textContent = 'copied!'; } catch (e) {}
    };
    el('key-dl').onclick = () => {
      const blob = new Blob(
        [`Perilune identity key - keep this file private.\nkey: ${k}\n`],
        {type: 'text/plain'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'perilune-key.txt';
      a.click();
      URL.revokeObjectURL(a.href);
    };
    el('key-hide').onclick = () => location.reload();
  };

  // Two-step reveal: first click arms the warning, second click shows.
  el('key-btn').onclick = () => {
    el('key-body').innerHTML = `<div class="small" style="color:#E8A33D;
        margin-bottom:6px">Clicking again will SHOW your identity key.
      Anyone who sees this key can play as you - do not share it with
      anyone.</div>
      <button id="key-show">show my key</button>
      <button id="key-cancel">cancel</button>`;
    el('key-show').onclick = () => showKey(pid);
    el('key-cancel').onclick = () => location.reload();
  };

  // Rotation: the compromised-key remedy.
  el('rot-btn').onclick = () => {
    el('key-body').innerHTML = `<div class="small" style="color:#E8A33D;
        margin-bottom:6px">This generates a NEW key and permanently
      disables your current one everywhere - any other device still
      using the old key will stop working until you restore the new one
      there. Your codename and history are unchanged. Save the new key
      immediately after.</div>
      <button id="rot-go">generate replacement key</button>
      <button id="key-cancel">cancel</button>`;
    el('rot-go').onclick = async () => {
      try {
        const r = await fetch('/api/identity/rotate', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({key: pid})});
        if (!r.ok) throw new Error((await r.json()).detail || r.status);
        const d = await r.json();
        localStorage.setItem('hearts_pid', d.key);
        showKey(d.key);
        el('key-body').insertAdjacentHTML('afterbegin',
          `<div class="small" style="color:#7CBF8E; margin-bottom:6px">
           Key rotated - the old key no longer works. This is your NEW
           key; save it now.</div>`);
      } catch (e) {
        el('key-body').innerHTML = `<span class="small" style="color:#E5484D">
          rotation failed: ${e.message}</span>`;
      }
    };
    el('key-cancel').onclick = () => location.reload();
  };
}
</script>
<script src="/static/nav.js?v=5"></script>
</body>
</html>
