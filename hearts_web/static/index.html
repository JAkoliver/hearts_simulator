<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearts vs AI &mdash; match to 100</title>
<style>
  :root { --felt:#1d6b3c; --felt-dark:#155230; --card-bg:#fdfdf8; --gold:#e8b923; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui, sans-serif; background:var(--felt-dark); color:#eee;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { width:100%; text-align:center; padding:8px; background:#0e3a20; }
  header h1 { font-size:1.1rem; font-weight:600; display:inline; }
  header .sub { font-size:.78rem; color:#9fd4b3; }
  #layout { display:flex; gap:12px; align-items:flex-start; margin-top:10px; }
  #table { position:relative; width:min(92vw, 700px); height:min(56vh, 410px);
           background:radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-dark) 100%);
           border-radius:16px; box-shadow:0 4px 18px rgba(0,0,0,.5); }
  #side { width:170px; font-size:.8rem; display:flex; flex-direction:column; gap:8px; }
  .panel { background:rgba(0,0,0,.35); border-radius:10px; padding:8px 10px; }
  .panel h3 { font-size:.75rem; color:#9fd4b3; text-transform:uppercase; margin-bottom:5px; }
  .panel .mini { display:inline-flex; margin:1px; }
  .seat { position:absolute; text-align:center; font-size:.82rem; color:#cfe9d8; }
  .seat .tag { background:rgba(0,0,0,.35); padding:2px 10px; border-radius:10px; white-space:nowrap; }
  .seat.active .tag { background:var(--gold); color:#222; font-weight:600; }
  #seat-top { top:8px; left:50%; transform:translateX(-50%); }
  #seat-left { left:8px; top:50%; transform:translateY(-50%); }
  #seat-right { right:8px; top:50%; transform:translateY(-50%); }
  #seat-bottom { bottom:8px; left:50%; transform:translateX(-50%); }
  #trick { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .tcard { position:absolute; animation:drop .25s ease-out; }
  @keyframes drop { from { transform:scale(1.25) translateY(-16px); opacity:.4; } }
  .tcard.pos0 { translate:0 52px; }
  .tcard.pos1 { translate:-84px 0; }
  .tcard.pos2 { translate:0 -52px; }
  .tcard.pos3 { translate:84px 0; }
  #banner { position:absolute; top:40%; width:100%; text-align:center; font-size:1.05rem;
            color:#ffe28a; text-shadow:0 1px 3px #000; pointer-events:none; font-weight:600; }
  .card { display:inline-flex; flex-direction:column; justify-content:space-between;
          width:50px; height:72px; background:var(--card-bg); color:#111; border-radius:7px;
          border:1px solid #999; padding:4px 5px; font-weight:700; font-size:.92rem;
          box-shadow:0 2px 5px rgba(0,0,0,.35); user-select:none; position:relative; }
  .card .suit { font-size:1.2rem; line-height:1; align-self:flex-end; }
  .card.red { color:#c22; }
  .card.mini { width:34px; height:48px; font-size:.7rem; padding:2px 3px; border-radius:5px; }
  .card.mini .suit { font-size:.85rem; }
  #hand { display:flex; flex-wrap:wrap; gap:6px; justify-content:center;
          padding:10px 8px 2px; max-width:96vw; min-height:90px; }
  #hand .card { cursor:pointer; transition:transform .08s; }
  #hand .card.illegal { opacity:.38; cursor:not-allowed; }
  #hand .card:not(.illegal):hover { transform:translateY(-8px); }
  #hand .card.selected { transform:translateY(-14px); outline:3px solid var(--gold); }
  #hand .card.selected::after { content:'✓'; position:absolute; top:-22px; left:50%;
          translate:-50% 0; color:var(--gold); font-size:1rem; }
  #status { padding:5px 12px; font-size:.95rem; text-align:center; min-height:2em; }
  #status .thinking::after { content:''; animation:dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% {content:'';} 25% {content:'.';} 50% {content:'..';} 75% {content:'...';} }
  button { background:var(--gold); border:0; color:#222; font-weight:600; padding:8px 20px;
           border-radius:8px; font-size:.95rem; cursor:pointer; margin:4px; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button:hover:not(:disabled) { filter:brightness(1.08); }
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none;
             align-items:center; justify-content:center; z-index:10; }
  #overlay .opanel { background:#12331f; border-radius:14px; padding:24px 32px; text-align:center;
                     max-width:440px; }
  #overlay h2 { color:#ffe28a; margin-bottom:10px; }
  #overlay table { margin:0 auto 10px; border-collapse:collapse; }
  #overlay td, #overlay th { padding:4px 14px; text-align:center; }
  footer { font-size:.7rem; color:#88ab96; padding:6px; text-align:center; }
  @media (max-width:900px) { #layout { flex-direction:column; align-items:center; }
    #side { width:min(92vw, 700px); flex-direction:row; flex-wrap:wrap; } }
</style>
</head>
<body>
<header>
  <h1>Hearts vs AI</h1>
  <span class="sub">&mdash; three seats are a trained AI &middot; match to 100 &middot; lowest score wins</span>
</header>

<div id="layout">
  <div id="table">
    <div class="seat" id="seat-top"></div>
    <div class="seat" id="seat-left"></div>
    <div class="seat" id="seat-right"></div>
    <div class="seat" id="seat-bottom"></div>
    <div id="trick"></div>
    <div id="banner"></div>
  </div>
  <div id="side">
    <div class="panel"><h3>This deal</h3><div id="deal-info"></div></div>
    <div class="panel"><h3>Last trick</h3><div id="last-trick">None yet</div></div>
    <div class="panel"><h3>You received</h3><div id="received">&mdash;</div></div>
  </div>
</div>

<div id="status"></div>
<div id="pass-controls" style="display:none"><button id="pass-btn" disabled></button></div>
<div id="hand"></div>

<div id="overlay"><div class="opanel">
  <h2 id="o-title"></h2>
  <div id="o-body"></div>
  <button id="o-btn"></button>
</div></div>

<footer>An experiment in training a match-aware Hearts AI &middot; matches are recorded anonymously to improve it</footer>

<script>
const SUIT_CHAR = {C:'♣', D:'♦', S:'♠', H:'♥'};
const AI_DELAY = 800, PASS_DELAY = 150, TRICK_PAUSE = 2000, DEAL_PAUSE = 400;
let sid = null, state = null, busy = false, passSelection = [];

const el = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function cardHTML(name, cls='') {
  const suit = name.slice(-1), rank = name.slice(0, -1);
  const red = (suit === 'D' || suit === 'H') ? ' red' : '';
  return `<div class="card${red} ${cls}" data-name="${name}">
            <span>${rank}</span><span class="suit">${SUIT_CHAR[suit]}</span></div>`;
}
function pos(seat) { return (seat - state.your_seat + 4) % 4; }
const SEAT_IDS = ['seat-bottom', 'seat-left', 'seat-top', 'seat-right'];

function renderSeats(highlightSeat=null) {
  for (let s = 0; s < 4; s++) {
    const node = el(SEAT_IDS[pos(s)]);
    const label = s === state.your_seat ? 'You' : 'AI';
    node.innerHTML = `<span class="tag">${label} &middot; ${state.match_scores[s]}
      <small>(+${state.round_scores[s]})</small></span>`;
    node.classList.toggle('active', s === highlightSeat);
  }
}
function renderTrick(cards) {
  el('trick').innerHTML = cards.map(t =>
    `<div class="tcard pos${pos(t.seat)}">${cardHTML(t.name)}</div>`).join('');
}
function renderSide() {
  el('deal-info').innerHTML =
    `Deal ${state.deal_no} &middot; passing: <b>${state.pass_direction ?? '?'}</b>`;
  el('last-trick').innerHTML = state.last_trick
    ? state.last_trick.cards.map(c => cardHTML(c.name, 'mini')).join('') +
      `<div>${state.last_trick.winner === null ? '' :
        (state.last_trick.winner === state.your_seat ? 'you took it' : 'AI took it')}</div>`
    : 'None yet';
  el('received').innerHTML = state.received && state.received.length
    ? state.received.map(n => cardHTML(n, 'mini')).join('') : '&mdash;';
}
function renderHand() {
  const legal = new Set(state.legal);
  el('hand').innerHTML = state.hand.map(h => {
    let cls = legal.has(h.card) ? '' : 'illegal';
    if (passSelection.includes(h.card)) cls += ' selected';
    return cardHTML(h.name, cls);
  }).join('');
  document.querySelectorAll('#hand .card:not(.illegal)').forEach(node => {
    const card = state.hand.find(h => h.name === node.dataset.name).card;
    node.onclick = () => onCardClick(card);
  });
  const passing = state.your_turn && state.passing;
  el('pass-controls').style.display = passing ? 'block' : 'none';
  if (passing) {
    const need = 3 - state.passed_so_far.length;
    el('pass-btn').textContent =
      `Pass ${passSelection.length}/${need} ${state.pass_direction ?? ''}`;
    el('pass-btn').disabled = passSelection.length !== need || busy;
    el('pass-btn').onclick = confirmPass;
  }
}
function setStatus(msg, thinking=false) {
  el('status').innerHTML = thinking ? `<span class="thinking">${msg}</span>` : msg;
}
function render() {
  renderSeats(state.your_turn && !state.finished ? state.your_seat : null);
  renderTrick(state.trick);
  renderSide();
  renderHand();
  el('banner').textContent = '';
  if (state.finished) return showMatchEnd();
  if (state.your_turn)
    setStatus(state.passing
      ? `Select ${3 - state.passed_so_far.length} card(s) to pass ${state.pass_direction ?? ''}`
      : 'Your turn - click a card');
}

function onCardClick(card) {
  if (busy || !state.your_turn) return;
  if (state.passing) {
    const need = 3 - state.passed_so_far.length;
    const i = passSelection.indexOf(card);
    if (i >= 0) passSelection.splice(i, 1);          // deselect
    else if (passSelection.length < need) passSelection.push(card);
    renderHand();
  } else {
    submit([card]);
  }
}
function confirmPass() {
  if (passSelection.length === 3 - state.passed_so_far.length)
    submit(passSelection.slice());
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function submit(cards) {
  busy = true;
  passSelection = [];
  try {
    let events = [];
    for (const card of cards) {
      const resp = await api(`/api/play/${sid}`,
        {method:'POST', headers:{'Content-Type':'application/json'},
         body: JSON.stringify({card})});
      events = events.concat(resp.events || []);
      state = resp;
    }
    await animate(events);
    render();
  } catch (e) { setStatus('Error: ' + e.message); }
  finally { busy = false; }
}

// Replay the server's event list at human speed (desktop-game pacing)
async function animate(events) {
  let shown = [];
  const anyPlays = events.some(e => e.type === 'play');
  if (anyPlays) setStatus('AI is thinking', true);
  for (const ev of events) {
    if (ev.type === 'play') {
      shown.push({seat: ev.seat, name: ev.name});
      renderTrick(shown);
      renderSeats(ev.seat);
      await sleep(ev.seat === state.your_seat ? 120 : AI_DELAY);
    } else if (ev.type === 'trick_end') {
      renderTrick(ev.cards);
      el('banner').textContent = ev.winner === null ? '' :
        (ev.winner === state.your_seat ? 'You took the trick' : 'AI took the trick');
      await sleep(TRICK_PAUSE);
      el('banner').textContent = '';
      shown = [];
      renderTrick([]);
    } else if (ev.type === 'deal_end') {
      await showDealEnd(ev);
      await sleep(DEAL_PAUSE);
    }
  }
}

function showDealEnd(ev) {
  return new Promise(resolve => {
    el('o-title').textContent = ev.moon_by !== null
      ? (ev.moon_by === state.your_seat ? 'You shot the moon!' : 'The AI shot the moon!')
      : `Deal ${state.deal_no - 1} complete`;
    el('o-body').innerHTML = '<table><tr><th>Player</th><th>This deal</th><th>Total</th></tr>' +
      [0,1,2,3].map(s => `<tr><td>${s === state.your_seat ? 'You' : 'AI'}</td>
        <td>+${ev.round_scores[s]}</td><td>${ev.totals[s]}</td></tr>`).join('') + '</table>';
    el('o-btn').textContent = 'Next deal';
    el('o-btn').onclick = () => { el('overlay').style.display = 'none'; resolve(); };
    el('overlay').style.display = 'flex';
  });
}

function showMatchEnd() {
  const order = [0,1,2,3].sort((a,b) => state.placements[a] - state.placements[b]);
  const p = state.placements[state.your_seat];
  el('o-title').textContent = p === 1 ? 'You won the match!' :
    `You placed ${['','1st','2nd','3rd','4th'][Math.round(p)] || p}`;
  el('o-body').innerHTML = '<table><tr><th>Place</th><th>Player</th><th>Score</th></tr>' +
    order.map(s => `<tr><td>${state.placements[s]}</td>
      <td>${s === state.your_seat ? 'You' : 'AI'}</td>
      <td>${state.match_scores[s]}</td></tr>`).join('') + '</table>';
  el('o-btn').textContent = 'Play again';
  el('o-btn').onclick = () => { el('overlay').style.display = 'none'; newMatch(); };
  el('overlay').style.display = 'flex';
}

async function newMatch() {
  passSelection = [];
  state = await api('/api/new', {method:'POST'});
  sid = state.sid;
  render();
}
newMatch();
</script>
</body>
</html>
